# DRAFT for hermes-agent plugin-catalog/. repo/sha/subdir are placeholders until the plugin has a public repository.
name: hermes-palace
repo: https://github.com/TODO/hermes-palace
sha: TODO-40-hex-commit
title: Hermes Palace
description: 'Shows your own Hermes as a small 3D world: scheduled jobs, profiles, skills and the docs library as objects,
  and a live feed of which agents are working. Disclosure — reads Hermes cron/jobs.json, the plugin config and skill files
  read-only; publishes metadata only (names, counts, states, timestamps, tool names), never message text, prompts, tool
  arguments or results; everything is off until you run `hermes palace setup` (only a health card is on by default);
  the work board comes from `hermes kanban list --json` and session facts from SessionDB(read_only=True) (fields cut down on parse); reading Hermes'' private state.db / kanban.db directly is a separate opt-in (allow_direct_db_read, off); talks only to
  127.0.0.1 (the engine you start yourself); it starts processes only as argv lists, never a shell: the hermes CLI (cron list, kanban list, and pause/resume/run of one cron job only after your Hermes approval, failing closed when nobody can approve), and, on your command, the Node that Hermes'' package manager provides, for the engine (`hermes palace up`) and the docs viewer; the pinned engine release is downloaded in-process (https, sha256 verified before unpacking) only when you run `hermes palace install-engine` or `setup --first-run`, and git for the docs viewer (README lists every call site); no telemetry, no self-update, no bundled binaries.'
maintainer: TODO
tier: community
category: desktop
requires_hermes: ">=0.22.0, <0.24"
version: "0.7.0"
docs_url: https://github.com/TODO/hermes-palace
platforms: []
# Checked 2026-11-05 against what __init__.py really registers (2 tools, 9 hooks, 1 CLI command); the Desktop page/sidebar row are contributions of desktop/plugin.js, not capabilities.
capabilities:
  provides_tools: [palace_state, palace_cron_action]
  provides_hooks: [pre_tool_call, post_tool_call, pre_llm_call, pre_api_request, subagent_start, subagent_stop, on_session_start, on_session_end, on_session_finalize]
  provides_middleware: []
  requires_env: []
