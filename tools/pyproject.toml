# Tools for the quality gates (`make check`), never installed with the plugin. They live here, outside the root
# pyproject.toml, because Hermes reads that file and would ask users to install them. Exact pins for the tools whose output
# decides a gate (formatter, linters, type checker); uv.lock pins the rest. `[tool.uv] exclude-newer` is the release
# quarantine: nothing published after that date resolves (move it forward by hand, >= 3 days back, as Hermes does).
[dependency-groups]
dev = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "websockets>=13,<18",
    "pyyaml>=6,<7",
    "types-PyYAML>=6,<7",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "ruamel.yaml>=0.18,<0.20",
    "reuse>=5,<7",
]

[tool.uv]
exclude-newer = "2026-11-08T00:00:00Z"
