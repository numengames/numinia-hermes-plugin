[project]
name = "hermes-palace"
version = "0.7.2rc1"
description = "Hermes plugin: bridge between Hermes and a Numinia Engine 'hermes' world"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

# The one place the range is configured for tooling; plugin.yaml and the catalog draft must carry the same string (tests/test_requires_hermes.py).
[tool.hermes-palace]
requires_hermes = ">=0.22.0, <0.24"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE", "RUF012", "SIM117", "E402"]
"__init__.py" = ["E402"]
"dashboard/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
files = ["hermes_palace_lib"]

[[tool.mypy.overrides]]
module = ["hermes_palace_lib.settings", "hermes_palace_lib.linkkey", "hermes_palace_lib.procid", "hermes_palace_lib.logsafe", "hermes_palace_lib.worldtext"]
strict = true

[tool.coverage.run]
source = ["hermes_palace_lib"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
