[project]
name = "hermes-3d"
version = "0.8.2"
description = "Turn your Hermes into a 3D game world you can walk through. Your scheduled jobs, conversations and system health become places to explore, right on your own computer. Anything that changes Hermes, like pausing a job, waits for your approval. Built on the Numinia Engine by Numen Games."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

# The one place the range is configured for tooling; plugin.yaml and the catalog draft must carry the same string (tests/test_requires_hermes.py).
[tool.hermes-3d]
requires_hermes = ">=0.22.0, <0.24"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE", "RUF012", "SIM117", "E402"]
"__init__.py" = ["E402"]
"dashboard/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
files = ["hermes_3d_lib"]

[[tool.mypy.overrides]]
module = ["hermes_3d_lib.settings", "hermes_3d_lib.linkkey", "hermes_3d_lib.procid", "hermes_3d_lib.logsafe", "hermes_3d_lib.worldtext"]
strict = true

[tool.coverage.run]
source = ["hermes_3d_lib"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
